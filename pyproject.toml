[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishscope"
version = "1.0.0"
description = "Phishing email investigation toolkit for SOC analysts: header forensics, SPF/DKIM/DMARC, URL intel, blast radius, one-page verdict report."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "NikoRNK", email = "" }]
keywords = ["soc", "phishing", "dfir", "blue-team", "email-security", "threat-intel"]
dependencies = []

[project.optional-dependencies]
dns = ["dnspython>=2.4"]
dev = ["pytest>=7", "dnspython>=2.4"]

[project.scripts]
phishscope = "phishscope.cli:main"

[tool.setuptools.packages.find]
include = ["phishscope*"]
